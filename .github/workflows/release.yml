name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npx webpack

      - name: Lint
        run: npx web-ext lint --ignore-files "src/" "node_modules/" "package.json" "package-lock.json" "webpack.config.js" "build.bash" "doc/"

      - name: Package zip
        run: npx web-ext build --ignore-files "src/" "node_modules/" "package.json" "package-lock.json" "webpack.config.js" "build.bash" "doc/"

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"


      - name: Stage update assets
        run: |
          cd web-ext-artifacts
          ZIP=$(ls *.zip)
          cp "$ZIP" "${ZIP%.zip}.xpi"
          node - <<'NODE'
          const fs = require('fs');
          const ver = require('../manifest.json').version;
          const id = require('../manifest.json').browser_specific_settings.gecko.id;
          const repo = process.env.GITHUB_REPOSITORY;
          const tag = process.env.GITHUB_REF_NAME;
          const zipName = fs.readdirSync('.').find(f => f.endsWith('.zip'));
          const xpiName = zipName.replace(/[.]zip$/, '.xpi');
          const json = { addons: {} };
          json.addons[id] = { updates: [{ version: ver, update_link: 'https://github.com/' + repo + '/releases/download/' + tag + '/' + xpiName }] };
          fs.writeFileSync('updates.json', JSON.stringify(json, null, 2));
          console.log(fs.readFileSync('updates.json', 'utf8'));
          NODE

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          files: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/*.xpi
            web-ext-artifacts/updates.json
          generate_release_notes: true

  # Mirror code + tags to CNB; its tag_push pipeline then publishes the CNB
  # release. Requires the CNB_TOKEN secret; skipped while unconfigured.
  # NOTE: `secrets` is not allowed in `if` expressions on this GitHub
  # instance; check the env-injected token instead.
  sync-cnb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to CNB mirror
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        if: ${{ env.CNB_TOKEN != '' }}
        run: |
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/boris007/thunderbird_email_assistant_ai.git"
          git push cnb HEAD:main --tags --force
