name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npx webpack

      - name: Lint
        continue-on-error: true  # newer web-ext treats Thunderbird-only permissions as errors
        run: npx web-ext lint --ignore-files "src/" "node_modules/" "package.json" "package-lock.json" "webpack.config.js" "build.bash" "doc/"

      - name: Package zip
        run: npx web-ext build --ignore-files "src/" "node_modules/" "package.json" "package-lock.json" "webpack.config.js" "build.bash" "doc/"

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      # Two update flavors: the GitHub flavor checks for updates on GitHub
      # Releases; the CNB flavor reads the raw manifest file on cnb.cool and
      # downloads updates from the CNB release mirror (fast in China).
      - name: Stage update assets
        run: |
          cd web-ext-artifacts
          VER="${{ steps.ver.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          REPO="borisxxz/thunderbird_email_assistant_ai"
          CNB_REPO="boris007/thunderbird_email_assistant_ai"
          ID=$(node -p "require('../manifest.json').browser_specific_settings.gecko.id")
          ZIP=$(ls *.zip)

          cp "$ZIP" "email_assistant-${VER}-github.xpi"

          sed -i "s|https://github.com/${REPO}/releases/latest/download/updates.json|https://cnb.cool/${CNB_REPO}/-/git/raw/main/updates-cnb.json|" ../manifest.json
          cd ..
          npx web-ext build --overwrite-dest --ignore-files "src/" "node_modules/" "package.json" "package-lock.json" "webpack.config.js" "build.bash" "doc/"
          cd web-ext-artifacts
          cp "$ZIP" "email_assistant-${VER}-cnb.xpi"

          cat > updates.json <<EOF
          {
            "addons": {
              "${ID}": {
                "updates": [
                  {
                    "version": "${VER}",
                    "update_link": "https://github.com/${REPO}/releases/download/${TAG}/email_assistant-${VER}-github.xpi"
                  }
                ]
              }
            }
          }
          EOF
          cd ..
          cat > updates-cnb.json <<EOF
          {
            "addons": {
              "${ID}": {
                "updates": [
                  {
                    "version": "${VER}",
                    "update_link": "https://cnb.cool/${CNB_REPO}/-/releases/download/${TAG}/email_assistant-${VER}-cnb.xpi"
                  }
                ]
              }
            }
          }
          EOF
          git checkout -- manifest.json

      - name: Publish CNB update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates-cnb.json
          git commit -m "chore: update CNB update manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:main

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.version }}
          files: |
            web-ext-artifacts/*.zip
            web-ext-artifacts/*-github.xpi
            web-ext-artifacts/*-cnb.xpi
            web-ext-artifacts/updates.json
          generate_release_notes: true

  # Mirror code + tags to CNB; its tag_push pipeline then publishes the CNB
  # release. Requires the CNB_TOKEN secret; skipped while unconfigured.
  sync-cnb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to CNB mirror
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        if: ${{ env.CNB_TOKEN != '' }}
        run: |
          git checkout main   # include the freshly committed CNB update manifest
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/boris007/thunderbird_email_assistant_ai.git"
          git push cnb main --tags --force
